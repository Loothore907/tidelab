[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tidelab"
version = "0.1.0"
description = "Evidence-controlled, multi-venue market research platform"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "websockets==17.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
]

[project.scripts]
tidelab = "tidelab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --basetemp=.pytest-tmp"
pythonpath = ["src"]
testpaths = ["tests"]
